name: Django CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5 # Atualizado para v5
        with:
          python-version: "3.12"
          cache: "pip" # Ajuda a ser mais rápido nas próximas vezes

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run System Check
        run: |
          # Em vez de 'test' (que pode exigir DB complexa), 
          # o 'check' valida se os modelos e UUIDs estão corretos.
          python manage.py check

      - name: Run Tests
        run: |
          python manage.py test
