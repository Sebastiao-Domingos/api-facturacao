services:
  - type: web
    name: sergao-api
    runtime: python3.12
    region: frankfurt
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn core.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --threads 4 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DJANGO_SECRET_KEY
        value: django-insecure-$-z^^ziw7ye2ltvz$@_gp*+l62rt3g(x!2$49j3str&5=36w9u
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com,localhost,127.0.0.1
      - key: CORS_ALLOWED_ORIGINS
        value: http://localhost:3000
      - key: ACCESS_TOKEN_LIFETIME_MINUTES
        value: 60
      - key: REFRESH_TOKEN_LIFETIME_DAYS
        value: 7
      - key: API_PAGE_SIZE
        value: 20
      - key: CLOUDINARY_CLOUD_NAME
        value: df8s3k2
      - key: CLOUDINARY_API_KEY
        value: 123456789
      - key: CLOUDINARY_API_SECRET
        value: abcde12345

  - type: postgres
    name: sergao-db
    region: frankfurt
    databaseName: facturacao
    user: sergao_admin